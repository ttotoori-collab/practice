<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손글씨 숫자 인식기</title>
<link rel="stylesheet" href="스타일.css">
</head>
<body>
  <header class="머리말">
    <h1>손글씨 숫자 인식기</h1>
    <p>아래 검은 칸에 숫자를 하나 그려 보세요. 붓을 떼면 자동으로 인식합니다.</p>
  </header>

  <main class="본문">
    <section class="그림판칸">
      <canvas id="그림판" class="그림판" aria-label="숫자를 그리는 칸"></canvas>
      <div class="버튼줄">
        <button id="인식버튼" type="button">인식하기</button>
        <button id="지우기버튼" type="button">지우기</button>
      </div>
      <p class="안내글">붓을 떼면 자동으로 인식합니다.</p>
    </section>

    <section class="결과칸">
      <p id="결과숫자" class="결과숫자" aria-live="polite">?</p>
      <p id="확신도" class="확신도">모델을 불러오는 중입니다…</p>
      <div id="확률표" class="확률표"></div>
    </section>
  </main>

  <p id="오류" class="오류" role="alert" hidden></p>

  <footer class="꼬리말">
    <p>
      합성곱 신경망(CNN)이 MNIST 손글씨 숫자 6만 장으로 학습한 모델로 예측합니다.
      추론은 서버 없이 이 브라우저 안에서만 이루어집니다.
    </p>
    <p>
      같은 모델을 쓰는 데스크톱 버전(Windows, tkinter)도 있습니다. 자세한 내용은
      저장소의 안내를 참고하세요.
    </p>
  </footer>

  <script type="module" src="js/앱.js"></script>
</body>
</html>
