# 웹 앱들을 GitHub Pages 에 올리는 워크플로.
#
# GitHub Pages 는 저장소마다 사이트가 하나뿐이라, 웹 앱이 둘이면 한 폴더로
# 합쳐서 올려야 한다. 주소는 이렇게 나뉜다.
#
#   /          손글씨 숫자 인식기   (web_version/)
#   /jlpt/     일본어 단어장        (jlpt_version/)
#
# GitHub Pages 는 "저장소 뿌리" 또는 "/docs" 만 소스로 지정할 수 있어서,
# 이렇게 Actions 로 올려야 한다.
#
# 처음 한 번은 저장소 설정에서 켜 주어야 한다:
#   Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로
#
# 빌드 단계는 없다. 웹 버전은 외부 라이브러리를 쓰지 않는 정적 파일 묶음이다.
#
# 참고: job 과 step 의 id 는 GitHub 규칙상 영문·숫자·_·- 만 쓸 수 있어서
# 이 파일에서는 한글 식별자를 쓰지 못한다. 사람이 읽는 name 만 한글로 적는다.

name: 웹 앱 배포

on:
  push:
    branches: [main]
    paths:
      - "web_version/**"
      - "jlpt_version/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한 번에 하나만 돌린다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 웹 앱들을 Pages 로 배포
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Pages 설정 읽기
        uses: actions/configure-pages@v5

      # 손글씨 인식기는 뿌리에, 일본어 단어장은 /jlpt/ 아래에 둔다.
      # 기존 주소(/)를 그대로 지키려고 web_version 쪽을 뿌리로 삼았다.
      - name: 두 앱을 한 폴더로 모으기
        run: |
          mkdir -p _사이트/jlpt
          cp -r web_version/. _사이트/
          cp -r jlpt_version/. _사이트/jlpt/

      - name: 모은 폴더를 아티팩트로 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: _사이트

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
